name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "renovate.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "biome.json"
      - "wrangler.jsonc"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "renovate.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "biome.json"
      - "wrangler.jsonc"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup pnpm first: setup-node's pnpm cache needs the pnpm executable.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build

      - name: Validate Worker deployment bundle
        run: pnpm dlx wrangler@4.167.0 deploy --dry-run --config wrangler.jsonc
